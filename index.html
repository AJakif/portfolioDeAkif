<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Browser tab title and the description search engines show. -->
    <title>Ahmed Jahin Akif Portfolio</title>
    <meta
      name="description"
      content="Ahmed Jahin Akif is an AI and full-stack engineer in Dhaka who builds AI features, web apps, and the cloud services that keep them running."
    />

    <!-- The small icon in the browser tab. The file is public/favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Fonts (Google Fonts).
      - Unbounded       : headings
      - Hanken Grotesk  : body text
      - Dela Gothic One : the Japanese katakana lettering
      If you change a font here, also update the font variables in
      src/styles/tokens.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Hanken+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React renders the whole site inside this div (see src/main.jsx). -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
